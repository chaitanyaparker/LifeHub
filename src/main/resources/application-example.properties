
# ==========================================
# Application Configuration
# ==========================================
spring.application.name=lifehub
server.port=${SERVER_PORT:8080}

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JWT Authentication Configuration
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# ==========================================
# Redis Configuration
# ==========================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

spring.devtools.restart.enabled=false

# ==========================================
# GeoIP Configuration
# ==========================================
geoip.database.path=${GEOIP_DATABASE_PATH:}

# ==========================================
# Weather API Configuration
# ==========================================
weather.api.base-url=${WEATHER_API_BASE_URL}
weather.api.key=${WEATHER_API_KEY}

# ==========================================
# Gmail SMTP Configuration
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# Google OAuth2 Configuration
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Apache Kafka (Aiven) Configuration
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.listener.auto-startup=false

# Kafka Security
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

# Kafka Truststore (Aiven CA)
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:}
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD:}
spring.kafka.ssl.trust-store-type=${KAFKA_TRUSTSTORE_TYPE:}

# ==========================================
# Kafka Producer Configuration
# ==========================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ==========================================
# Kafka Consumer Configuration
# ==========================================
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.LifeHub.Notification.NotificationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.LifeHub.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=DEBUG
